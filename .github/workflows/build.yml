name: Build DeclaraFácil 510

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install reportlab openpyxl customtkinter pyinstaller
        shell: pwsh

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed `
            --name "Formulario510" `
            --collect-all customtkinter `
            main.py
        shell: pwsh

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Formulario510-Windows
          path: dist/Formulario510.exe
          retention-days: 30
